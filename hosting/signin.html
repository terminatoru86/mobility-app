<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOBIlity · Sign in</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#24333C}
.c{max-width:340px;padding:24px;text-align:center}
h1{font-size:30px;font-weight:900;margin:10px 0 6px}
p{color:#5D6D75;line-height:1.45;margin:8px 0}
a.b{display:block;margin:18px auto 0;padding:14px 18px;border-radius:999px;background:#24333C;color:#fff;font-weight:800;text-decoration:none}
.hide{display:none}
</style></head>
<body><div class="c">
<svg width="72" height="72" viewBox="0 0 64 64"><path d="M14 44 V28 A9 9 0 0 1 32 28 V44 M32 28 A9 9 0 0 1 50 28 V44" fill="none" stroke="#24333C" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="54" r="4.6" fill="#E0484D"/><circle cx="32" cy="54" r="4.6" fill="#E9A800"/><circle cx="50" cy="54" r="4.6" fill="#5D9A30"/></svg>
<h1>MOBIlity</h1>
<div id="android" class="hide">
  <p>Opening MOBIlity to sign you in…</p>
  <a class="b" id="open" href="#">Open MOBIlity</a>
</div>
<div id="other" class="hide">
  <p><b>Open this email on your Android phone</b>, the one with MOBIlity, and tap the link there.</p>
  <p>MOBIlity is not on iPhone or computers yet.</p>
</div>
</div>
<script>
// The sign-in link from the email brings you here (after Firebase checks it). On Android we hand
// the whole link to the app; it signs you in. Elsewhere: say where to open it.
var q = location.search || '';
var android = /Android/i.test(navigator.userAgent);
if (android && q.indexOf('oobCode') >= 0) {
  var app = 'intent://' + location.host + location.pathname + q +
            '#Intent;scheme=https;package=com.mobility.mobility;end';
  document.getElementById('open').href = app;
  document.getElementById('android').className = '';
  location.href = app;
} else {
  document.getElementById('other').className = '';
}
</script>
</body></html>
