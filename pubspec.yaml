name: mobility
description: "MOBIlity - places, parking and routes for riders in Chicago."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  http: ^1.2.2
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  archive: ^3.6.1
  mobile_scanner: ^6.0.2
  webview_flutter: ^4.10.0
  web: ^1.1.0
  android_id: ^0.4.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/glyphs/
    - assets/vehicles/
    - assets/brand/
    - assets/osm/
    - assets/osm/tiles/
