name: mobility
description: "MOBIlity - places, parking and routes for riders in Chicago."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  http: ^1.2.2
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/glyphs/
    - assets/vehicles/
    - assets/brand/
    - assets/osm/
