name: Android project (create / update)

# Creates the android/ folder with Flutter's own template and our permissions,
# and saves it in the repo. After it runs: pull in Android Studio and press Run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the runner is nearly full)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android/ (keeps anything already there)
        run: flutter create --platforms=android --org com.mobility --project-name mobility .
      - name: Permissions
        run: python3 tool/android_permissions.py android/app/src/main/AndroidManifest.xml
      - name: Unit tests
        run: |
          flutter pub get
          flutter test --reporter expanded 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          grep -E "\[E\]|Expected:|Actual:|Some tests failed" test.log | head -30 | while read -r l; do echo "::error::test: $l"; done
          exit $code
      - name: Check it builds (errors are shown as annotations)
        if: always()
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee pub.log
          echo "::notice::versions: $(flutter pub deps --style=compact 2>/dev/null | grep -E '^- (vector_map_tiles|vector_map_tiles_pmtiles|pmtiles|vector_tile_renderer|flutter_map|archive) ' | cut -d' ' -f2,3 | tr '\n' ' ')"
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          grep -E "^ *error " analyze.log | head -40 | while read -r l; do echo "::error::analyze: $l"; done
          set +e
          flutter build apk --debug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "Error:|error:|FAILURE|What went wrong" -A3 build.log | head -60 | while read -r l; do echo "::error::build: $l"; done
          grep -iE "error|because|version solving" pub.log | head -20 | while read -r l; do echo "::error::pub: $l"; done
          exit $code
      - name: Save to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          rm -f pub.log analyze.log build.log test.log
          git add -A android
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Android project (flutter create + permissions)"
          git stash -u || true
          git pull --rebase
          git push
