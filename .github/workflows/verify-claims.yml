name: Verify owner requests

# Checks the requests business owners send from the app (shop_claims) and approves, rejects or keeps
# waiting, by itself. Rules: tool/verify_claims.py. Needs the secrets FIREBASE_SERVICE_ACCOUNT (the
# service-account JSON) and FIREBASE_PROJECT_ID; without them it only says so and stops.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-claims
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tool/verify_claims.py --selftest
      - name: Install
        run: pip install google-auth requests
      - name: Check the requests
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: python3 tool/verify_claims.py
