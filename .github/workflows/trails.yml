name: Bike routes (trails)

# Collects named bicycle / mountain-bike routes with their lines:
#  1. OpenStreetMap route relations (bicycle, mountain bike, motorcycle) from the Geofabrik extracts, under 50 km
#  2. Trails that national parks, forests, states, counties and cities publish as open data (ArcGIS Online)
# Result: data/trails/trails.json.gz, data/trails/REPORT.md and the pieces the app downloads (data/trails/tiles).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: [us-midwest, us-northeast, us-pacific, us-south, us-west, us/puerto-rico]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: Self-test
        run: python3 tool/osm_routes.py
      - name: Download the extract
        run: bash tool/get_extract.sh "${{ matrix.region }}" region.osm.pbf
      - name: Routes of this region
        run: |
          osmium tags-filter region.osm.pbf r/route=bicycle,mtb,motorcycle,road -o routes.osm.pbf
          python3 tool/osm_routes.py routes.osm.pbf routes.json
      - name: Named paths for riders (bike / scooter / MTB / motorcycle, no walking-only) and the sights along the way
        run: |
          osmium tags-filter region.osm.pbf w/highway=cycleway,path,footway,bridleway,pedestrian,track \
            nwr/tourism=viewpoint,museum,zoo,aquarium,theme_park,attraction,artwork nwr/historic \
            nwr/natural=valley,gorge,canyon,waterfall,peak,volcano,arch,cliff,rock,stone,cave_entrance,water,beach,bay \
            nwr/waterway=waterfall nwr/man_made=lighthouse,tower,bridge -o paths.osm.pbf
          rm region.osm.pbf
          python3 tool/bike_paths.py paths.osm.pbf paths.json sights.json
      - name: Name the result
        run: echo "NAME=$(echo '${{ matrix.region }}' | tr '/' '-')" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: trails-osm-${{ env.NAME }}
          path: |
            routes.json
            paths.json
            sights.json
          retention-days: 2

  official:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tool/trails_official.py
      - name: Parks, forests, states, counties and cities
        run: python3 tool/trails_official.py official.json official_layers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trails-official
          path: |
            official.json
            official_layers.txt
          retention-days: 2

  merge:
    needs: [osm, official]
    if: ${{ !cancelled() && (needs.osm.result == 'success' || needs.official.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master   # the newest data (the other runs save routes too)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Join and report
        run: |
          python3 tool/trails_merge.py data/trails $(ls parts/*/routes.json parts/*/official.json 2>/dev/null)
          cp parts/trails-official/official_layers.txt data/trails/official_layers.txt 2>/dev/null || true
          python3 - <<'PY'
          import glob, gzip, json
          paths = [r for f in glob.glob('parts/*/paths.json') for r in json.load(open(f))]
          sights = [x for f in glob.glob('parts/*/sights.json') for x in json.load(open(f))]
          if paths:
              open('data/trails/paths.json.gz', 'wb').write(gzip.compress(json.dumps(paths, separators=(',', ':')).encode(), 9, mtime=0))
          if sights:
              open('data/trails/sights.json.gz', 'wb').write(gzip.compress(json.dumps(sights, separators=(',', ':')).encode(), 9, mtime=0))
          print(f'named paths for riders: {len(paths)} · sights: {len(sights)}')
          PY
          python3 tool/trails_tiles.py
          ls -la data/trails
      - name: Save in the repository
        run: |
          git config user.name "mobility-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/trails
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Bike routes $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs
          git push
