name: Preview pictures

# Draws app screens as pictures (preview/*_test.dart) so the design can be checked without a phone.
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test preview --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/out/*.png
