name: Schools, malls, markets, work zones, parks, stations

# Places riders go to (schools to universities, malls and markets, industrial zones and business parks, parks,
# train / bus stations and park & ride, libraries / city halls / community centers / hospitals, stadiums and sports
# centers, hotels), from OpenStreetMap (Geofabrik) and Overture. Their own websites are read for everything in our
# categories (racks, motorcycle / scooter parking, rentals, air, repair stands, charging, washes); what the map lacks
# is added (data/venues/<group>.json -> map packs). Then the map packs are rebuilt in full (also finds city / campus
# layers and the wall-outlet charging list).
on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'which groups (comma list), or all'
        required: false
        default: 'all'

permissions:
  contents: write
  actions: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        region: [us-midwest, us-northeast, us-pacific, us-south, us-west, us/puerto-rico]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tool
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: Download the extract
        run: bash tool/get_extract.sh "${{ matrix.region }}" region.osm.pbf
      - name: The places
        run: |
          osmium tags-filter region.osm.pbf \
            nwr/amenity=school,college,university,marketplace,library,townhall,community_centre,hospital,bus_station \
            nwr/amenity=courthouse,post_office,public_building,coworking_space nwr/office=government,company,coworking nwr/government \
            nwr/building=office,commercial nwr/aeroway=aerodrome,terminal nwr/railway=halt \
            nwr/shop=mall nwr/landuse=industrial,commercial,retail nwr/leisure=park,stadium,sports_centre \
            nwr/public_transport=station nwr/railway=station nwr/park_ride nwr/tourism=hotel -o cut.osm.pbf
          rm region.osm.pbf
          python3 tool/venues.py --pbf cut.osm.pbf part.json
      - name: Name the result
        run: echo "NAME=$(echo '${{ matrix.region }}' | tr '/' '-')" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ven-osm-${{ env.NAME }}
          path: part.json
          retention-days: 2

  group:
    needs: osm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        group: [offices, corporate, campus, shopping, work, parks, transit, civic, sports, hotels, government]
    steps:
      - name: Wanted this time?
        id: want
        run: |
          g="${{ github.event.inputs.groups || 'all' }}"
          if [ "$g" = "all" ] || echo ",$g," | grep -q ",${{ matrix.group }},"; then echo "go=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.go
      - uses: actions/setup-python@v5
        if: steps.want.outputs.go
        with:
          python-version: '3.12'
      - run: pip install duckdb
        if: steps.want.outputs.go
      - uses: actions/download-artifact@v4
        if: steps.want.outputs.go
        with:
          pattern: ven-osm-*
          path: parts
      - name: Read the websites
        if: steps.want.outputs.go
        run: python3 tool/venues.py --group ${{ matrix.group }} $(ls parts/*/part.json)
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.go
        with:
          name: ven-${{ matrix.group }}
          path: data/venues/
          retention-days: 2

  save:
    needs: group
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ven-*
          path: got
      - name: Save in the repository
        run: |
          mkdir -p data/venues
          find got -path '*ven-osm-*' -prune -o -type f \( -name '*.json' -o -name 'REPORT_*.md' \) -print -exec cp {} data/venues/ \;
          rm -f data/venues/part.json
          for f in data/venues/REPORT_*.md; do head -12 "$f"; echo; done
          git config user.name "mobility-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/venues
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Schools, malls, markets, work zones, parks, stations $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs
          git push
      - name: Rebuild the map packs (in full)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo 'Map packs are rebuilt by coverage.yml or by hand'
