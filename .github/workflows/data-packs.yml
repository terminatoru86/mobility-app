name: Data packs (whole US, fast)

# OpenStreetMap from the Geofabrik extracts (5 US regions + Puerto Rico, in parallel, ~20-40 min),
# then the city halls, the automatic discovery (ArcGIS Online + Socrata), MBTA and Overture.
# Packs are gzip-compressed 1° pieces in assets/osm/tiles.
on:
  # every Sunday early morning (Chicago): the newest data from every source
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = everything again; extra = keep OpenStreetMap, redo the other sources; places = only shops again (Overture, Foursquare, All The Places)'
        required: false
        default: 'full'

permissions:
  contents: write

jobs:
  osm:
    if: github.event.inputs.mode != 'extra' && github.event.inputs.mode != 'places'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        region: [us-midwest, us-northeast, us-pacific, us-south, us-west, us/puerto-rico]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: Download the extract
        run: curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors -C - "https://download.geofabrik.de/north-america/${{ matrix.region }}-latest.osm.pbf" -o region.osm.pbf
      - name: Keep only the rider places
        run: |
          osmium tags-filter region.osm.pbf \
            nwr/amenity=bicycle_parking,bicycle_repair_station,compressed_air,bicycle_wash,bicycle_rental,charging_station \
            nwr/amenity=motorcycle_parking,small_electric_vehicle_parking,kick-scooter_parking,mobility_hub \
            nwr/shop=bicycle,motorcycle,scooter,motorcycle_repair \
            nwr/sport=bmx -o filtered.osm.pbf
          # private / customers-only areas: a rack inside one is on private property
          osmium tags-filter region.osm.pbf a/access=private,customers,permit,residents -o priv.pbf
          rm region.osm.pbf
          python3 tool/osm_extract.py filtered.osm.pbf osm.json
          osmium export priv.pbf -f geojsonseq --geometry-types=polygon -o priv.geojsonseq
          python3 tool/private_areas.py priv.geojsonseq private.json
          rm -f priv.pbf priv.geojsonseq
      - name: Name the result
        run: echo "NAME=$(echo '${{ matrix.region }}' | tr '/' '-')" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: osm-${{ env.NAME }}
          path: |
            osm.json
            private.json
          retention-days: 2

  build:
    needs: osm
    if: always() && (needs.osm.result == 'success' || github.event.inputs.mode == 'extra' || github.event.inputs.mode == 'places')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: github.event.inputs.mode != 'extra' && github.event.inputs.mode != 'places'
        with:
          path: osm
      - name: Build the packs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          pip install duckdb
          if [ "${{ github.event.inputs.mode }}" = "extra" ]; then
            python3 tool/build_packs.py --extra-only
          elif [ "${{ github.event.inputs.mode }}" = "places" ]; then
            python3 tool/build_packs.py --refresh=overture,foursquare,alltheplaces
          else
            python3 tool/build_packs.py $(for f in osm/*/osm.json; do echo "--osm-json=$f"; done) $(for f in osm/*/private.json; do echo "--private-json=$f"; done)
          fi
      - name: Save them in the repository
        run: |
          git config user.name "mobility-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/osm/tiles data/contacts data/site_hours.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data packs $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs || { git checkout --theirs assets/osm/tiles data/contacts; git add -A assets/osm/tiles data/contacts; GIT_EDITOR=true git rebase --continue; }
          git push
