name: Data packs (build here, by hand only)

# The packs are normally built in the public repository terminatoru86/mobility-data
# (free minutes, published on its site) and copied here by sync-packs.yml.
# This one stays for building them here by hand if ever needed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the packs (OpenStreetMap + city halls, whole US)
        run: python3 tool/build_packs.py
      - name: Save them in the repository
        run: |
          git config user.name "mobility-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/osm/tiles
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data packs $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
