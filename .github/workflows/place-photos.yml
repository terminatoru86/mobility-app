name: Front photos of the shops

# Looks for street photos (2024 on) that face each named shop, service hub and rental, in the open
# street-photo collections (Mapillary, Panoramax, KartaView), and keeps where the best ones are
# in data/place_photos.json. Each place is looked up again about every two months.
on:
  # every Friday early morning (Chicago)
  schedule:
    - cron: '41 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Look for the photos
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          PHOTO_MINUTES: '110'
        run: |
          python3 tool/place_photos.py --test
          python3 tool/place_photos.py
      - name: Save in the repository
        run: |
          git config user.name "mobility-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/place_photos.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Front photos of the shops $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs
          git push
