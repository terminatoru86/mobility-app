name: Build APK

# Makes an installable Android file. Download it from the run page (Artifacts → MOBIlity-apk).
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the runner is nearly full)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter build apk --release
      - name: Check the APK (which settings plugin is inside)
        run: |
          echo "::notice::$(flutter pub deps --style=compact | grep -E '^- shared_preferences_android ' | cut -d' ' -f2,3)"
          mkdir -p chk && cd chk && unzip -qo ../build/app/outputs/flutter-apk/app-release.apk 'classes*.dex'
          n=$(cat classes*.dex | strings | grep -c 'SharedPreferencesApiRegistrar' || true)
          echo "::notice::SharedPreferencesApiRegistrar (2.5 JNI, crashes) found: $n"
      - uses: actions/upload-artifact@v4
        with:
          name: MOBIlity-apk
          path: build/app/outputs/flutter-apk/app-release.apk
